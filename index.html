function normalizeItems(data) {
  const arr = Array.isArray(data) ? data : data && Array.isArray(data.items) ? data.items : null;
  if (!arr || !arr.length) return null;
  const seen = new Set(), out = [];
  for (const o of arr) {
    if (!o || typeof o.type !== "string" || !o.type) return null;
    const [w, d, hh, cx, cy, rot] = ["w", "d", "h", "cx", "cy", "rot"].map((k) => Number(o[k]));
    if (![w, d, hh, cx, cy, rot].every(Number.isFinite) || w <= 0 || d <= 0 || hh <= 0) return null;
    const id = typeof o.id === "string" && o.id && !seen.has(o.id) ? o.id : newId(o.type);
    seen.add(id);
    out.push({
      id, type: o.type,
      name: typeof o.name === "string" ? o.name : (LIB[o.type] ? LIB[o.type].name : o.type),
      w, d, h: hh, cx, cy,
      rot: (((Math.round(rot / 90) * 90) % 360) + 360) % 360,
    });
  }
  return out;
}

      if (noCollide(bs[b][0].type)) continue;

      if (A.x1 < B.x2 - 0.5 && A.x2 > B.x1 + 0.5 && A.y1 < B.y2 - 0.5 && A.y2 > B.y1 + 0.5) {
        s.add(bs[a][0].id); s.add(bs[b][0].id);
      }
    }
  }
  return s;
}

/* ============ 插座檢查 ============ */
// 會擋住插座的傢俱（書桌、餐桌、椅子下方是空的；床頭櫃後的插座本來就是給床頭用的，都不算）
const BLOCKERS = new Set(["sofa", "armchair", "tvcab", "piano", "sideboard", "glasscab", "tallcab", "bench", "wardrobe", "bookshelf",
  "storage", "bed", "bedQ", "bedS", "fridge", "counter", "washer", "toilet", "sink", "tub", "appliance"]);
// 需要電源的傢俱電器：附近 150cm 內要有可用的電源插座（電視櫃要電視插座）
const NEEDS = { fridge: "冰箱", washer: "洗衣機", tvcab: "電視", desk: "書桌", nightstand: "床頭", counter: "流理台", appliance: "電器櫃" };
const CORD = 150;
function checkOutlets(items) {
  const outs = items.filter((i) => isOutlet(i.type)), furn = items.filter((i) => !isOutlet(i.type));
  const blocked = [], missing = [];
  outs.forEach((o) => {
    const k = OUTLETS[o.type];
    furn.forEach((f) => {
      if (!BLOCKERS.has(f.type) || (k.serves || []).includes(f.type) || f.h <= o.h) return;
      const b = boxOf(f);
      if (o.cx > b.x1 - 3 && o.cx < b.x2 + 3 && o.cy > b.y1 - 3 && o.cy < b.y2 + 3) blocked.push({ o, f });
    });
  });
  const blockedIds = new Set(blocked.map((x) => x.o.id));
  furn.forEach((f) => {
    if (!NEEDS[f.type]) return;
    const b = boxOf(f);
    const ok = outs.some((o) => {
      const k = OUTLETS[o.type];
      if (blockedIds.has(o.id) && !(k.serves || []).includes(f.type)) return false;
      if (f.type === "tvcab" ? o.type !== "o_tv" : !k.power) return false;
      const dx = Math.max(b.x1 - o.cx, 0, o.cx - b.x2), dy = Math.max(b.y1 - o.cy, 0, o.cy - b.y2);
      return Math.hypot(dx, dy) <= CORD;
    });
    if (!ok) missing.push(f);
  });
  return { blocked, missing, count: outs.length };
}

function computeGaps(sel, items) {
  if (!sel || noCollide(sel.type)) return [];
  const b = boxOf(sel);
  const obs = [...WALL_BOXES, ...items.filter((i) => i.id !== sel.id && !noCollide(i.type)).map(boxOf)];
  const res = [];
  const cy = (b.y1 + b.y2) / 2, cx = (b.x1 + b.x2) / 2;
  let best;
  best = Infinity;
  obs.forEach((o) => { if (o.y1 < b.y2 - 1 && o.y2 > b.y1 + 1 && o.x1 >= b.x2 - 1) best = Math.min(best, o.x1 - b.x2); });
  if (best < 300) res.push({ x1: b.x2, y1: cy, x2: b.x2 + best, y2: cy, v: best });
  best = Infinity;
  obs.forEach((o) => { if (o.y1 < b.y2 - 1 && o.y2 > b.y1 + 1 && o.x2 <= b.x1 + 1) best = Math.min(best, b.x1 - o.x2); });
  if (best < 300) res.push({ x1: b.x1 - best, y1: cy, x2: b.x1, y2: cy, v: best });
  best = Infinity;
  obs.forEach((o) => { if (o.x1 < b.x2 - 1 && o.x2 > b.x1 + 1 && o.y1 >= b.y2 - 1) best = Math.min(best, o.y1 - b.y2); });
  if (best < 300) res.push({ x1: cx, y1: b.y2, x2: cx, y2: b.y2 + best, v: best });
  best = Infinity;
  obs.forEach((o) => { if (o.x1 < b.x2 - 1 && o.x2 > b.x1 + 1 && o.y2 <= b.y1 + 1) best = Math.min(best, b.y1 - o.y2); });
  if (best < 300) res.push({ x1: cx, y1: b.y1 - best, x2: cx, y2: b.y1, v: best });
  return res.filter((g) => g.v >= 2);
}

const doorGeom = (dr) => {
  const [hx, hy] = dr.h, [ex, ey] = dr.e;
  const vx = ex - hx, vy = ey - hy;
  const L = Math.hypot(vx, vy);
  const ox = -vy * dr.s, oy = vx * dr.s; // 開啟方向向量（長度 L）
  return { hx, hy, ex, ey, L, ox, oy };
};

/* ============ 2D 平面圖 ============ */
const FILL = {
  sofa: "#ddd2c2", armchair: "#ddd2c2", coffee: "#c49a6c", rug: "#ece4d8", tvcab: "#c49a6c",
  sideboard: "#efe8dc", tallcab: "#efe8dc", appliance: "#efe8dc", wardrobe: "#efe8dc", storage: "#efe8dc",
  bench: "#c49a6c", glasscab: "#4a4542", dtable: "#c49a6c", desk: "#c49a6c", chair: "#b38a5e",
  bed: "#f7f4ee", bedQ: "#f7f4ee", bedS: "#f7f4ee", nightstand: "#c49a6c", bookshelf: "#c49a6c",
  piano: "#2f2b28", plant: "#8aa077", fridge: "#e1e1df", counter: "#e5ddd0", washer: "#f4f4f2",
  toilet: "#fbfbfa", sink: "#fbfbfa", tub: "#fbfbfa", column: "#2f2b28", storeroom: "#d2b48c", shower: "#dfe6e8",
};
const DARK = new Set(["glasscab", "piano", "chair", "plant", "column"]);

function ItemShape({ it }) {
  const { w, d, type } = it;
  const f = FILL[type] || C.cream;
  const st = { fill: f, stroke: "#6b6159", strokeWidth: 1.2 };
  if (type === "coffee") return h("ellipse", { rx: w / 2, ry: d / 2, ...st });
  if (type === "plant") return h("circle", { r: Math.min(w, d) / 2, ...st });
  // 餐邊櫃兩端、玄關櫃右手邊的前緣圓角（與 3D 一致）
  const rr = type === "sideboard" || type === "tallcab" ? Math.min(15, d / 3, w / 5) : 0;
  const base = rr
    ? h("path", {
      key: "base", ...st,
      d: `M${-w / 2} ${-d / 2}H${w / 2}V${d / 2 - rr}A${rr} ${rr} 0 0 1 ${w / 2 - rr} ${d / 2}` +
        (type === "sideboard" ? `H${-w / 2 + rr}A${rr} ${rr} 0 0 1 ${-w / 2} ${d / 2 - rr}Z` : `H${-w / 2}Z`),
    })
    : h("rect", {
      key: "base", x: -w / 2, y: -d / 2, width: w, height: d, rx: type === "rug" ? 6 : 2, ...st,
      strokeDasharray: type === "rug" ? "6 5" : undefined,
    });
  const extra = [];
  if (type.startsWith("bed")) {
    const n = w >= 140 ? 2 : 1, pw = (w - 16) / n - 6;
    for (let i = 0; i < n; i++)
      extra.push(h("rect", { key: i, x: -w / 2 + 8 + i * (pw + 6) + 3, y: -d / 2 + 10, width: pw, height: 24, rx: 6, fill: "#fff", stroke: "#b6aca1", strokeWidth: 1 }));
    extra.push(h("rect", { key: "duvet", x: -w / 2 + 2, y: -d / 2 + 45, width: w - 4, height: d - 47, fill: "#e7ddcf", opacity: 0.9 }));
  }
  if (type === "sofa" || type === "armchair") {
    extra.push(h("rect", { key: "b", x: -w / 2, y: -d / 2, width: w, height: 20, fill: "#cfc2b0" }));
    extra.push(h("rect", { key: "l", x: -w / 2, y: -d / 2, width: 16, height: d, fill: "#cfc2b0" }));
    extra.push(h("rect", { key: "r", x: w / 2 - 16, y: -d / 2, width: 16, height: d, fill: "#cfc2b0" }));
  }
  if (type === "tvcab") {
    const tw = Math.min(w * 0.55, 190);
    extra.push(h("rect", { key: "tv", x: -tw / 2, y: -d / 2 + 1, width: tw, height: 5, fill: C.black }));
  }
  if (type === "shower") {
    extra.push(h("rect", { key: "tray", x: -w / 2 + 4, y: -d / 2 + 4, width: w - 8, height: d - 14, fill: "#5a5a5d", opacity: 0.55 }));
    extra.push(h("line", { key: "glass", x1: -w / 2, y1: d / 2 - 4, x2: w / 2, y2: d / 2 - 4, stroke: "#7aa7b0", strokeWidth: 3 }));
  }
  if (type === "storeroom") {
    extra.push(h("rect", { key: "hatch", x: -w / 2, y: -d / 2, width: w, height: d, fill: "url(#hatch)" }));
    extra.push(h("line", { key: "door", x1: -w / 2 + 4, y1: d / 2 - 2, x2: w / 2 - 4, y2: d / 2 - 2, stroke: ACC, strokeWidth: 4 }));
  }
  if (type === "tub") extra.push(h("rect", { key: "in", x: -w / 2 + 8, y: -d / 2 + 8, width: w - 16, height: d - 16, rx: 18, fill: "#e3eef0", stroke: "#b6c4c7" }));
  if (type === "sink") extra.push(h("ellipse", { key: "in", rx: w * 0.3, ry: d * 0.28, cy: 4, fill: "#e3eef0", stroke: "#b6c4c7" }));
  if (type === "toilet") extra.push(h("ellipse", { key: "in", rx: w * 0.42, ry: d * 0.3, cy: d * 0.12, fill: "#fff", stroke: "#b6aca1" }));
  const backLine = !["rug", "dtable", "desk", "column"].includes(type)
    ? h("line", { key: "back", x1: -w / 2, y1: -d / 2, x2: w / 2, y2: -d / 2, stroke: "#3a332e", strokeWidth: 3.5 })
    : null;
  return h(React.Fragment, null, base, extra, backLine);
}

// 量測點吸附：靠近牆面或傢俱邊緣（畫面 10px 內）時貼齊邊緣，否則取整到 1cm
function snapMeasure(p, items, tol) {
  const bs = [...WALL_BOXES, ...items.filter((i) => !noCollide(i.type)).map(boxOf)];
  let x = Math.round(p.x), y = Math.round(p.y), bx = tol, by = tol;
  bs.forEach((b) => {
    // 只吸附點旁邊的邊：垂直方向要落在該物件範圍內
    if (p.y > b.y1 - tol && p.y < b.y2 + tol)
      [b.x1, b.x2].forEach((v) => { const d = Math.abs(p.x - v); if (d < bx) { bx = d; x = v; } });
    if (p.x > b.x1 - tol && p.x < b.x2 + tol)
      [b.y1, b.y2].forEach((v) => { const d = Math.abs(p.y - v); if (d < by) { by = d; y = v; } });
  });
  return { x, y };
}

function Plan2D({ items, sel, setSel, updateItem, vb, setVb, overlaps, onDrag, measure, measures, pending, onMeasureTap, showOutlets, blockedOutlets }) {
  const svgRef = useRef(null);
  const ptrs = useRef(new Map());
  const g = useRef(null);
  const selItem = items.find((i) => i.id === sel);
  const gaps = useMemo(() => computeGaps(selItem, items), [selItem, items]);

  const toSvg = (e) => {
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  const startPinch = () => {
    const [a, b] = [...ptrs.current.values()];
    g.current = { type: "pinch", dist: Math.hypot(a.x - b.x, a.y - b.y), vb: { ...vb } };
  };
  const onItemDown = (e, it) => {
    if (measure) return; // 量測模式：交給背景處理，不選取、不拖曳
    e.stopPropagation();
    ptrs.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    svgRef.current.setPointerCapture(e.pointerId);
    if (ptrs.current.size === 2) { startPinch(); return; }
    setSel(it.id);
    onDrag(true);
    const p = toSvg(e);
    g.current = { type: "drag", id: it.id, ox: p.x - it.cx, oy: p.y - it.cy };
  };
  const onDown = (e) => {
    ptrs.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    svgRef.current.setPointerCapture(e.pointerId);
    if (ptrs.current.size === 2) { startPinch(); return; }
    g.current = { type: "pan", sx: e.clientX, sy: e.clientY, vb: { ...vb }, moved: false, p: toSvg(e) };
  };
  const onMove = (e) => {
    if (!ptrs.current.has(e.pointerId)) return;
    ptrs.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const G = g.current;
    if (!G) return;
    if (G.type === "drag") {
      const p = toSvg(e);
      updateItem(G.id, { cx: snap(p.x - G.ox), cy: snap(p.y - G.oy) });
    } else if (G.type === "pan") {
      const dx = e.clientX - G.sx, dy = e.clientY - G.sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) G.moved = true;
      const r = svgRef.current.getBoundingClientRect();
      const k = Math.max(G.vb.w / r.width, G.vb.h / r.height);
      setVb({ ...G.vb, x: G.vb.x - dx * k, y: G.vb.y - dy * k });
    } else if (G.type === "pinch" && ptrs.current.size >= 2) {
      const [a, b] = [...ptrs.current.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const f = Math.min(Math.max(G.dist / dist, 0.15), 4);
      const nw = Math.min(Math.max(G.vb.w * f, 180), 2400), nh = (nw * G.vb.h) / G.vb.w;
      const cx = G.vb.x + G.vb.w / 2, cy = G.vb.y + G.vb.h / 2;
      setVb({ x: cx - nw / 2, y: cy - nh / 2, w: nw, h: nh });
    }
  };
  const onUp = (e) => {
    const G = g.current;
    if (G && G.type === "pan" && !G.moved && ptrs.current.size === 1) {
      if (measure) {
        const r = svgRef.current.getBoundingClientRect();
        onMeasureTap(snapMeasure(G.p, items, 10 * Math.max(vb.w / r.width, vb.h / r.height)));
      } else setSel(null);
    }
    ptrs.current.delete(e.pointerId);

  };

    h("defs", null,
      h("pattern", { id: "grid", width: "50", height: "50", patternUnits: "userSpaceOnUse" },
        h("path", { d: "M50 0H0V50", fill: "none", stroke: "#000", strokeOpacity: "0.06", strokeWidth: "1" })),
      h("pattern", { id: "hatch", width: "14", height: "14", patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" },
        h("line", { x1: 0, y1: 0, x2: 0, y2: 14, stroke: "#b8976c", strokeWidth: 2 }))),
    FLOORS.map(([x1, y1, x2, y2, t], i) =>
      h("rect", { key: "f" + i, x: x1, y: y1, width: x2 - x1, height: y2 - y1, fill: t === "w" ? "#ead9c0" : "#e4e2de" })),
    FLOORS.map(([x1, y1, x2, y2], i) =>
      h("rect", { key: "g" + i, x: x1, y: y1, width: x2 - x1, height: y2 - y1, fill: "url(#grid)" })),
    ROOMS.map((r) => h("g", { key: r.n, className: "nopt" },
      h("text", { x: r.x, y: r.y, textAnchor: "middle", fontSize: "22", fill: "#8a7f74", fontWeight: "600" }, r.n),
      r.d ? h("text", { x: r.x, y: r.y + 20, textAnchor: "middle", fontSize: "15", fill: "#a3988c" }, r.d) : null)),
    DOORS.map((dr, i) => {

      h("line", { x1, y1, x2, y2, stroke: "#7aa7b0", strokeWidth: 1.2 }))),
    // 插座：圓圈固定為畫面上約 8px，標籤不隨旋轉
    outlets.map((o) => {
      const isSel = o.id === sel, bad = blockedOutlets.has(o.id), nw = isNewOutlet(o), r = Math.max(7, 8 * k);

    }),
    h("g", { className: "nopt" },
      h("path", { d: "M200 700 L188 722 L212 722 Z", fill: ACC }),

function makeTextures(renderer) {
  const wood = document.createElement("canvas");
  wood.width = wood.height = 512;
  let ctx = wood.getContext("2d");
  const pl = 512 / 12;
  for (let i = 0; i < 12; i++) {
    const v = Math.random() * 18 - 9;
    ctx.fillStyle = `rgb(${214 + v},${186 + v},${148 + v})`;
    ctx.fillRect(0, i * pl, 512, pl);
    for (let k = 0; k < 6; k++) {
      ctx.strokeStyle = `rgba(140,100,60,${0.05 + Math.random() * 0.06})`;
      ctx.beginPath();
      const y = i * pl + Math.random() * pl;
      ctx.moveTo(0, y); ctx.bezierCurveTo(170, y + 3, 340, y - 3, 512, y + 1); ctx.stroke();
    }
    ctx.fillStyle = "rgba(110,80,50,0.35)";
    ctx.fillRect(0, i * pl, 512, 1.5);
    const j = Math.random() * 512;
    ctx.fillRect(j, i * pl, 1.5, pl);
  }
  const tile = document.createElement("canvas");
  tile.width = tile.height = 256;
  ctx = tile.getContext("2d");
  ctx.fillStyle = "#e7e4df"; ctx.fillRect(0, 0, 256, 256);
  ctx.strokeStyle = "#cbc6be"; ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, 128, 128); ctx.strokeRect(128, 0, 128, 128);
  ctx.strokeRect(0, 128, 128, 128); ctx.strokeRect(128, 128, 128, 128);
  const out = {};
  [["w", wood], ["t", tile]].forEach(([k, c]) => {
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    out[k] = new THREE.MeshStandardMaterial({ map: t, roughness: 0.85 });
  });
  return out;
}

function clearGroup(g) {
  while (g.children.length) {
    const c = g.children.pop();
    c.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  }
}

function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 花紋都畫在 512×512 可無縫拼接的畫布上；size = 一張畫布代表幾公分
const PS = 512;
function drawPlanks(x, base, rows, seed, vary) {
  const R = rng(seed), ph = PS / rows;
  for (let i = 0; i < rows; i++) {
    const start = R() * 256;
    for (let p = start; p < PS + start;) {
      const len = 150 + R() * 210, v = R() * vary * 2 - vary;
      [p, p - PS].forEach((px) => {
        x.fillStyle = `rgb(${base[0] + v},${base[1] + v},${base[2] + v})`;
        x.fillRect(px, i * ph, len, ph);
        for (let k = 0; k < 4; k++) {
          x.strokeStyle = `rgba(70,45,25,${0.04 + R() * 0.05})`;
          const y = i * ph + 3 + R() * (ph - 6);
          x.beginPath(); x.moveTo(px, y); x.bezierCurveTo(px + len / 3, y + 2, px + (2 * len) / 3, y - 2, px + len, y + 1); x.stroke();
        }
        x.fillStyle = "rgba(60,40,25,0.35)"; x.fillRect(px, i * ph, 1.5, ph);
      });
      p += len;
    }
    x.fillStyle = "rgba(60,40,25,0.3)"; x.fillRect(0, i * ph, PS, 1.5);
  }
}
function drawChevron(x) {
  // 法式人字拼：四欄斜板，左右欄斜向相反；顏色依（欄, 列 mod 16）固定，上下可無縫
  const bw = 128, ph = 32, R = rng(7), cols = [];
  for (let i = 0; i < 64; i++) cols.push(R() * 22 - 11);
  for (let c = 0; c < 4; c++) {
    const s = c % 2 ? -1 : 1, x0 = c * bw, x1 = x0 + bw;
    for (let y = -2 * PS; y < 2 * PS; y += ph) {
      const v = cols[(c % 2) * 32 + (((Math.round(y / ph) % 16) + 16) % 16)];
      x.fillStyle = `rgb(${210 + v},${181 + v},${142 + v})`;
      x.beginPath(); x.moveTo(x0, y); x.lineTo(x1, y - s * 64); x.lineTo(x1, y - s * 64 + ph); x.lineTo(x0, y + ph); x.closePath(); x.fill();

function drawMarble(x) {
  const R = rng(11);
  x.fillStyle = "#ecebe7"; x.fillRect(0, 0, PS, PS);
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
    x.save(); x.beginPath(); x.rect(tx * 256, ty * 256, 256, 256); x.clip();

      x.beginPath(); let px = tx * 256 + R() * 256, py = ty * 256; x.moveTo(px, py);
      for (let s = 0; s < 6; s++) { px += R() * 80 - 30; py += 50; x.lineTo(px, py); }

  x.strokeStyle = "rgba(0,0,0,0.12)"; x.lineWidth = 2;
  [0, 256].forEach((v) => { x.beginPath(); x.moveTo(v, 0); x.lineTo(v, PS); x.moveTo(0, v); x.lineTo(PS, v); x.stroke(); });

function drawSpecks(x, base, colors, n, rmin, rmax, seed, alpha) {
  const R = rng(seed);
  x.fillStyle = base; x.fillRect(0, 0, PS, PS);
  for (let i = 0; i < n; i++) {
    const cx = R() * PS, cy = R() * PS, r = rmin + R() * (rmax - rmin), col = colors[Math.floor(R() * colors.length)];
    x.globalAlpha = alpha == null ? 1 : alpha;
    x.fillStyle = col;
    [-PS, 0, PS].forEach((ox) => [-PS, 0, PS].forEach((oy) => {
      if (cx + ox + r < 0 || cx + ox - r > PS || cy + oy + r < 0 || cy + oy - r > PS) return;
      x.beginPath(); x.ellipse(cx + ox, cy + oy, r, r * (0.6 + R() * 0.4), R() * 3, 0, Math.PI * 2); x.fill();
    }));
  }
  x.globalAlpha = 1;
}
// 大理石紋磁磚：每片各自畫紋路，tw×th 為單片在 512 畫布上的像素
function drawStoneTiles(x, base, vein, tw, th, seed) {
  const R = rng(seed);
  x.fillStyle = base; x.fillRect(0, 0, PS, PS);
  for (let ty = 0; ty < PS; ty += th) for (let tx = 0; tx < PS; tx += tw) {
    x.save(); x.beginPath(); x.rect(tx, ty, tw, th); x.clip();
    const v = R() * 12 - 6;
    x.fillStyle = `rgba(${128 + v},${128 + v},${125 + v},0.08)`; x.fillRect(tx, ty, tw, th);
    for (let k = 0; k < 9; k++) {
      x.strokeStyle = `${vein}${0.05 + R() * 0.12})`; x.lineWidth = 1 + R() * 5;
      x.beginPath(); let px = tx - 20, py = ty + R() * th; x.moveTo(px, py);
      for (let s = 0; s < 6; s++) { px += tw / 5; py += R() * 30 - 15; x.lineTo(px, py); }
      x.stroke();
    }
    x.restore();
  }
  x.strokeStyle = "rgba(90,90,88,0.45)"; x.lineWidth = 2;
  for (let v = 0; v <= PS; v += tw) { x.beginPath(); x.moveTo(v, 0); x.lineTo(v, PS); x.stroke(); }
  for (let v = 0; v <= PS; v += th) { x.beginPath(); x.moveTo(0, v); x.lineTo(PS, v); x.stroke(); }
}
// 白大理石八角磚：60×60 白大理石紋，四角切出黑色小菱形（依主浴照片）
function drawOctagon(x) {

  }
  x.strokeStyle = "rgba(140,140,138,0.5)"; x.lineWidth = 1.5;
  for (let ty = 0; ty <= PS; ty += 256) for (let tx = 0; tx <= PS; tx += 256) {
    x.beginPath(); x.moveTo(tx - r, ty); x.lineTo(tx, ty + r); x.lineTo(tx + r, ty); x.lineTo(tx, ty - r); x.closePath(); x.stroke();

}

/* ============ 順手高度試算 ============ */
// 係數 × 身高；演算法參考哇沙米家「順手高度試算」（來源：《一輩子用得上的尺寸事典》，吊衣／曬衣／作業台係數另計）
// kind：range 多人取交集；upper／point 取最小（遷就最矮的人）；lower 取最大（遷就最高的人）
const HT_SCEN = [
  { key: "furniture", label: "伸手使用的傢俱", metrics: [

    { key: "shoulder", label: "肩膀以上的收納範圍", kind: "range", lo: 0.85, hi: 1.0 },
    { key: "drawer", label: "抽屜的高度上限", kind: "upper", hi: 0.9 },
    { key: "easy", label: "方便收納的範圍", kind: "range", lo: 0.4, hi: 0.85 },
    { key: "shelf", label: "容易使用的層架下限", kind: "lower", lo: 0.4 },
    { key: "stoop", label: "彎腰收納的範圍", kind: "range", lo: 0.2, hi: 0.4 },
  ] },
  { key: "laundry", label: "吊衣與曬衣", metrics: [

    { key: "hang", label: "吊衣桿高度", kind: "point", hi: 1.03 },

    { key: "top", label: "作業台高度", kind: "point", hi: 0.55 },

const KEY_HEIGHTS = "c3-heights-v1";
const HT_MIN = 100, HT_MAX = 220, HT_MAX_MEMBERS = 8;

function loadHeights() {

        members: d.members.slice(0, HT_MAX_MEMBERS).map((m) => ({ id: String(m.id || htNewMember().id), name: String(m.name || ""), h: m.h == null ? "" : String(m.h) })),
        scen: HT_SCEN.some((s) => s.key === d.scen) ? d.scen : "furniture",

const htName = (m, i) => m.name.trim() || `成員 ${i + 1}`;
// 內部用未捨入值計算交集，顯示時才取整，避免捨入製造或抹掉交集
function htCompute(people, metrics) {
  return metrics.map((d) => {
    const los = d.lo != null ? people.map((p) => d.lo * p.h) : [];
    const his = d.hi != null ? people.map((p) => d.hi * p.h) : [];
    const lo = los.length ? Math.max(...los) : null, hi = his.length ? Math.min(...his) : null;

}
const htText = (r) => {
  const R = Math.round;

  if (r.kind === "range") return `${R(r.lo)} – ${R(r.hi)} cm`;
  if (r.kind === "upper") return `${R(r.hi)} cm 以下`;

function HeightChart({ people, results }) {
  const W = 320, H = 300, top = 14, bot = H - 22;

  results.forEach((r) => { if (r.ok) [r.lo, r.hi, r.other].forEach((v) => { if (v != null && v > max) max = v; }); });
  max = Math.ceil(max / 50) * 50;
  const y = (v) => bot - (v / max) * (bot - top);
  const ticks = [];
  for (let v = 0; v <= max; v += 50) ticks.push(v);
  const BAND = ["#2f6f78", "#c49a6c", "#7c9a87", "#a27a52", "#5b8fa0", "#b98a5a", "#8a7f74"];

        h("text", { x, y: bot + 14, textAnchor: "middle", fontSize: 9, fill: "#6b6159", stroke: "none" }, p.label.slice(0, 4)));
    }),
    results.map((r, i) => {
      if (!r.ok) return null;
      const c = BAND[i % BAND.length];
      if (r.kind === "range") return h("rect", { key: r.key, x: bx, width: bw, y: y(r.hi), height: Math.max(1, y(r.lo) - y(r.hi)), fill: c, opacity: 0.16, stroke: c, strokeWidth: 1 });
      const v = r.kind === "lower" ? r.lo : r.hi;
      return h("g", { key: r.key },
        r.other != null ? h("line", { x1: bx, x2: bx + bw, y1: y(r.other), y2: y(r.other), stroke: c, strokeWidth: 1.2, strokeDasharray: "3 3", opacity: 0.5 }) : null,
        h("line", { x1: bx, x2: bx + bw, y1: y(v), y2: y(v), stroke: c, strokeWidth: 2.5 }),
        h("text", { x: bx + bw - 2, y: y(v) - 4, textAnchor: "end", fontSize: 10, fontWeight: 700, fill: c }, Math.round(v)));
    }),
    h("line", { x1: 34, x2: W - 4, y1: bot, y2: bot, stroke: "#8d8378", strokeWidth: 1.5 }));
}

function HeightTool({ onClose }) {
  const [st, setSt] = useState(loadHeights);
  useEffect(() => { try { localStorage.setItem(KEY_HEIGHTS, JSON.stringify(st)); } catch (e) { /* 僅本次有效 */ } }, [st]);
  const upd = (id, patch) => setSt((s) => ({ ...s, members: s.members.map((m) => (m.id === id ? { ...m, ...patch } : m)) }));
  const scen = HT_SCEN.find((s) => s.key === st.scen);
  const filled = st.members.map((m, i) => ({ ...m, label: htName(m, i), hv: m.h === "" ? null : Number(m.h) })).filter((m) => m.hv != null && isFinite(m.hv));
  const bad = filled.filter((m) => m.hv < HT_MIN || m.hv > HT_MAX);
  const people = filled.filter((m) => m.hv >= HT_MIN && m.hv <= HT_MAX).map((m) => ({ id: m.id, label: m.label, h: m.hv }));
  let results = people.length ? htCompute(people, scen.metrics) : [];
  // 多人時「方便收納範圍」對不上，就改照主要使用者一人計算
  const pivot = results.find((r) => r.key === "easy");
  const noOverlap = people.length > 1 && pivot && !pivot.ok;
  const primary = noOverlap ? people.find((p) => p.id === st.primary) : null;
  if (primary) results = htCompute([primary], scen.metrics);
  const missing = st.members.length - filled.length;

  return h("div", { className: "modalbg", onClick: (e) => { if (e.target === e.currentTarget) onClose(); } },
    h("div", { className: "modal wide", role: "dialog", "aria-label": "順手高度試算" },
      h("div", { className: "mhd" }, h("strong", null, "順手高度試算"), h("button", { className: "x", onClick: onClose, "aria-label": "關閉" }, "×")),
      h("p", { className: "mnote" }, "填上家人的身高，算出櫃子、衣桿和作業台順手的高度。數字是估算，定案前用捲尺在牆上標出來，請實際使用的人站著試一次。"),
      h("div", { className: "htmembers" },
        st.members.map((m, i) => h("div", { key: m.id, className: "htrow" },
          h("input", { className: "htname", value: m.name, placeholder: `成員 ${i + 1}`, maxLength: 10, onChange: (e) => upd(m.id, { name: e.target.value }) }),
          h("label", { className: "nf" },
            h("input", { inputMode: "numeric", value: m.h, placeholder: "身高", onChange: (e) => upd(m.id, { h: e.target.value.replace(/[^\d.]/g, "") }) }),
            h("span", null, "cm")),
          st.members.length > 1 ? h("button", { className: "sb del htdel", onClick: () => setSt((s) => ({ ...s, members: s.members.filter((x) => x.id !== m.id) })), "aria-label": "移除" }, "移除") : null)),
        st.members.length < HT_MAX_MEMBERS ? h("button", { className: "mbtn", onClick: () => setSt((s) => ({ ...s, members: [...s.members, htNewMember()] })) }, "＋ 新增家人") : null),
      h("div", { className: "cats" },
        HT_SCEN.map((s) => h("button", { key: s.key, className: "chip" + (st.scen === s.key ? " on" : ""), onClick: () => setSt((x) => ({ ...x, scen: s.key })) }, s.label))),
      bad.length ? h("p", { className: "mnote warn" }, `${bad.map((m) => m.label).join("、")} 的身高看起來不太對（可填 ${HT_MIN}–${HT_MAX} 公分），先沒算進去。`) : null,
      missing > 0 && filled.length ? h("p", { className: "mnote small" }, `還有 ${missing} 位沒填身高，沒有算進去。`) : null,
      !people.length ? h("p", { className: "mnote" }, "填好至少一位家人的身高，這裡就會出現結果。")
      : h(React.Fragment, null,
        noOverlap ? h("div", { className: "mconfirm" },
          h("p", null, h("strong", null, "這幾位的方便收納範圍沒有重疊。"), "身高差比較多時，同一個高度沒辦法讓每個人都順手，請選主要使用這個空間的人："),
          h("div", { className: "cats" }, people.map((p) => h("button", { key: p.id, className: "chip" + (primary && primary.id === p.id ? " on" : ""), onClick: () => setSt((x) => ({ ...x, primary: p.id })) }, p.label)))) : null,
        noOverlap && !primary ? null : h(React.Fragment, null,
          h("p", { className: "mnote" }, primary ? `以下照 ${primary.label}（${primary.h} 公分）的身高計算。`
            : people.length > 1 ? `以下是 ${people.map((p) => p.label).join("、")} 共同順手的高度：範圍取交集，上限遷就最矮的人，下限遷就最高的人。`
            : `以下照 ${people[0].label}（${people[0].h} 公分）的身高計算。`),
          h("div", { className: "htresult" },
            h(HeightChart, { people: primary ? [primary] : people, results }),
            h("ul", { className: "htlist" },
              results.map((r) => h("li", { key: r.key },
                h("span", null, r.label),
                h("strong", null, htText(r)),
                r.other != null ? h("small", null, r.kind === "lower" ? `最矮的人可到 ${Math.round(r.other)} cm` : `最高的人可到 ${Math.round(r.other)} cm`) : null)))))),
      h("p", { className: "mnote small" }, "身高只存在這台裝置的瀏覽器。")));
}

/* ============ 主程式 ============ */
const INIT_VB = { x: -30, y: -30, w: 1080, h: 975 };

function App() {
  const [boot] = useState(loadSaved);
  const [items, setItems] = useState(boot.items);
  const [status, setStatus] = useState(boot.status);
  const [ceil, setCeil] = useState(boot.ceil);

  const [tab, setTab] = useState("2d");
  const [night, setNight] = useState(false);
  const [cutaway, setCutaway] = useState(false);
  const [vb, setVb] = useState(INIT_VB);
  const [wide, setWide] = useState(window.innerWidth >= 900);
  const [confirmReset, setConfirmReset] = useState(false);
  const [addCat, setAddCat] = useState(null);
  const [menu, setMenu] = useState(false);
  const fileRef = useRef(null);
  const firstSave = useRef(true);

  // 房間同步：lastSynced 存最近一次上傳或收到的 JSON 字串，用來擋掉自己寫入後的回彈；
  // joined 在收到房間第一筆快照前為 false，避免加入有資料的房間時先把本機配置推上去蓋掉
  const [roomCode, setRoomCode] = useState(() => (fdb ? cleanCode(location.hash.slice(1)) : ""));
  const [online, setOnline] = useState(false);
  const [roomUI, setRoomUI] = useState(false);
  const [codeInput, setCodeInput] = useState("");
  const [pendingJoin, setPendingJoin] = useState(null);
  const [copied, setCopied] = useState(false);
  const itemsRef = useRef(items);
  itemsRef.current = items;
  const lastSynced = useRef(null);
  const joined = useRef(false);
  const dragging = useRef(false);

  const [schemes, setSchemes] = useState(loadSchemes);
  const [schemeUI, setSchemeUI] = useState(false);
  const [schemeName, setSchemeName] = useState("");
  const [confirmAct, setConfirmAct] = useState(null); // { id, act } 兩段式確認
  const [renaming, setRenaming] = useState(null); // { id, name }
  const schemesRef = useRef(schemes);
  schemesRef.current = schemes;
  const lastSchemes = useRef(null);
  const schemesJoined = useRef(false);

  // 裝修搭配（牆色／地板），A、B 兩組
  const [fin, setFin] = useState(loadFinish);
  const [finUI, setFinUI] = useState(false);
  const [finSide, setFinSide] = useState("A");
  const [finRoom, setFinRoom] = useState("客廳");
  const [finTab, setFinTab] = useState("wall");
  const [compare, setCompare] = useState(false);
  const [photoUI, setPhotoUI] = useState(false);
  const finRef = useRef(fin);
  finRef.current = fin;
  const lastFin = useRef(null);
  const finJoined = useRef(false);

  const [heightUI, setHeightUI] = useState(false);
  const [addUI, setAddUI] = useState(false);
  const [showOutlets, setShowOutlets] = useState(true);
  const [outletUI, setOutletUI] = useState(false);
  const [confirmOutlets, setConfirmOutlets] = useState(false);
  const [measure, setMeasure] = useState(false);
  const [measures, setMeasures] = useState([]);
  const [pending, setPending] = useState(null);

  useEffect(() => {
    const r = () => setWide(window.innerWidth >= 900);
    window.addEventListener("resize", r);
    return () => window.removeEventListener("resize", r);
  }, []);

  useEffect(() => {
    if (!fdb) return;
    const ref = fdb.ref(".info/connected");
    const hd = ref.on("value", (s) => setOnline(s.val() === true));
    return () => ref.off("value", hd);
  }, []);

  useEffect(() => {
    if (!fdb || !roomCode) return;
    joined.current = false;
    lastSynced.current = null;
    const ref = roomItemsRef(roomCode);
    const hd = ref.on("value", (snap) => {
      const v = snap.val();
      if (v == null) {
        // 空房間：以本機配置當起始內容
        const s = JSON.stringify(itemsRef.current);
        lastSynced.current = s;
        ref.set(s);
        joined.current = true;
        return;
      }
      joined.current = true;
      if (v === lastSynced.current || dragging.current) return;
      let arr = null;
      try { arr = normalizeItems(JSON.parse(v)); } catch (e) { arr = null; }
      if (!arr) return;
      lastSynced.current = v;
      setItems(arr);
      setSel((cur) => (cur && arr.some((i) => i.id === cur) ? cur : null));
      setStatus("已同步房間配置");
    });
    const cref = fdb.ref("rooms/" + ROOM_PREFIX + roomCode + "/ceil");
    const ch = cref.on("value", (snap) => {
      const v = Number(snap.val());
      if (!v) { cref.set(ceilRef.current); return; }
      if (v !== ceilRef.current) setCeil(clampCeil(v));
    });
    // 方案：第一筆快照與本機合併後回寫，之後以雲端為準（刪除才能同步出去）
    schemesJoined.current = false;
    const sref = fdb.ref("rooms/" + ROOM_PREFIX + roomCode + "/schemes");
    let firstS = true;
    const sh = sref.on("value", (snap) => {
      const v = snap.val();
      let remote = [];
      if (v != null) { try { remote = normalizeSchemes(JSON.parse(v)); } catch (e) { remote = []; } }
      if (firstS) {
        firstS = false;
        const merged = mergeSchemes(schemesRef.current, remote);
        const s = JSON.stringify(merged);
        lastSchemes.current = s;
        schemesJoined.current = true;
        if (s !== v) sref.set(s);
        setSchemes(merged);
        return;
      }
      if (v == null || v === lastSchemes.current) return;
      lastSchemes.current = v;
      setSchemes(remote);
    });
    // 搭配：空房間就上傳本機的；有資料以雲端為準
    finJoined.current = false;
    const fref = fdb.ref("rooms/" + ROOM_PREFIX + roomCode + "/finish");
    const fh = fref.on("value", (snap) => {
      const v = snap.val();
      if (v == null) {
        const s = JSON.stringify(finRef.current);
        lastFin.current = s; fref.set(s); finJoined.current = true;
        return;
      }
      finJoined.current = true;
      if (v === lastFin.current) return;
      let f = null;
      try { f = normalizeFinish(JSON.parse(v)); } catch (e) { f = null; }
      if (!f) return;
      lastFin.current = JSON.stringify(f);
      setFin(f);
    });
    return () => { ref.off("value", hd); cref.off("value", ch); sref.off("value", sh); fref.off("value", fh); };
  }, [roomCode]);

  useEffect(() => {
    const s = JSON.stringify(schemes);
    try { localStorage.setItem(KEY_SCHEMES, s); } catch (e) { /* 僅本次有效 */ }
    if (fdb && roomCode && schemesJoined.current && s !== lastSchemes.current) {
      lastSchemes.current = s;
      fdb.ref("rooms/" + ROOM_PREFIX + roomCode + "/schemes").set(s);
    }
  }, [schemes]);

  const twoStep = (id, act, fn) => {
    if (confirmAct && confirmAct.id === id && confirmAct.act === act) { setConfirmAct(null); fn(); return; }
    setConfirmAct({ id, act });
    setTimeout(() => setConfirmAct((c) => (c && c.id === id && c.act === act ? null : c)), 3000);
  };
  const saveScheme = () => {
    const name = schemeName.trim() || `方案 ${schemes.length + 1}`;
    setSchemes((a) => [{ id: newId("plan"), name, savedAt: new Date().toISOString(), ceilH: ceil, items }, ...a]);
    setSchemeName(""); setStatus(`已儲存方案「${name}」`);
  };
  const overwriteScheme = (sc) => {
    setSchemes((a) => a.map((x) => (x.id === sc.id ? { ...x, items, ceilH: ceil, savedAt: new Date().toISOString() } : x)));
    setStatus(`已覆蓋方案「${sc.name}」`);
  };
  const loadScheme = (sc) => {
    setItems(sc.items); setCeil(sc.ceilH); setSel(null); setSchemeUI(false);
    setStatus(`已載入方案「${sc.name}」`);
  };
  const removeScheme = (sc) => { setSchemes((a) => a.filter((x) => x.id !== sc.id)); setStatus(`已刪除方案「${sc.name}」`); };
  const commitRename = () => {
    if (!renaming) return;
    const name = renaming.name.trim();
    if (name) setSchemes((a) => a.map((x) => (x.id === renaming.id ? { ...x, name } : x)));
    setRenaming(null);
  };

  const toggleMeasure = () => {
    setMeasure((v) => !v);
    setMeasures([]); setPending(null); setSel(null);
  };
  const onMeasureTap = (p) => {
    if (!pending) { setPending(p); return; }
    // 接近水平或垂直（偏差小於 15%）就鎖正，量牆到牆最常見
    const dx = Math.abs(p.x - pending.x), dy = Math.abs(p.y - pending.y);
    if (dy < dx * 0.15) p = { ...p, y: pending.y };
    else if (dx < dy * 0.15) p = { ...p, x: pending.x };
    if (p.x !== pending.x || p.y !== pending.y) setMeasures((m) => [...m, { x1: pending.x, y1: pending.y, x2: p.x, y2: p.y }]);
    setPending(null);
  };

  useEffect(() => {
    const s = JSON.stringify(fin);
    try { localStorage.setItem(KEY_FINISH, s); } catch (e) { /* 僅本次有效 */ }
    if (fdb && roomCode && finJoined.current && s !== lastFin.current) {
      lastFin.current = s;
      fdb.ref("rooms/" + ROOM_PREFIX + roomCode + "/finish").set(s);
    }
  }, [fin]);
  // 套用到目前編輯的那一組；room 為 "全部" 時套到每個空間
  const applyFinish = (kind, key) => setFin((f) => {
    const side = { wall: { ...f[finSide].wall }, floor: { ...f[finSide].floor } };
    (finRoom === "全部" ? FIN_ROOMS : [finRoom]).forEach((r) => { side[kind][r] = key; });
    return { ...f, [finSide]: side };
  });
  const copySide = () => setFin((f) => ({ ...f, [finSide === "A" ? "B" : "A"]: JSON.parse(JSON.stringify(f[finSide])) }));
  const openFinish = () => {
    setFinUI(true); setSel(null); setMenu(false);
    if (!wide) setTab("3d");
  };
  const curFin = fin[finSide];
  const finishBar = h("div", { className: "finbar" },
    h("div", { className: "finrow" },
      h("div", { className: "seg light" },
        ["A", "B"].map((s) => h("button", { key: s, className: finSide === s ? "on" : "", onClick: () => setFinSide(s) }, `搭配 ${s}`))),
      h("button", { className: "ic" + (compare ? " newon" : ""), onClick: () => setCompare((v) => !v) }, "左右比較"),
      h("button", { className: "ic", onClick: copySide, title: `把搭配 ${finSide} 複製到另一組` }, `複製到 ${finSide === "A" ? "B" : "A"}`),
      h("button", { className: "ic", onClick: () => setPhotoUI(true) }, "用照片模擬"),
      h("button", { className: "ic", onClick: () => { setFinUI(false); setCompare(false); } }, "完成")),
    h("div", { className: "finrow scroll" },
      ["全部", ...FIN_ROOMS].map((r) => h("button", { key: r, className: "chip" + (finRoom === r ? " on" : ""), onClick: () => setFinRoom(r) }, r))),
    h("div", { className: "finrow" },
      h("div", { className: "seg light" },
        h("button", { className: finTab === "wall" ? "on" : "", onClick: () => setFinTab("wall") }, "牆面油漆"),
        h("button", { className: finTab === "floor" ? "on" : "", onClick: () => setFinTab("floor") }, "地板")),
      h("span", { className: "unit" }, finRoom === "全部" ? `套用到全部空間（搭配 ${finSide}）`
        : `${finRoom}：${(PAINT[curFin.wall[finRoom]] || PAINT.base).n}・${(PAT[curFin.floor[finRoom]] || PAT.base).n}（搭配 ${finSide}）`)),
    h("div", { className: "finrow scroll swatches" },
      finTab === "wall"
        ? PAINTS.map((p) => h("button", {
          key: p.k, className: "sw" + (finRoom !== "全部" && (curFin.wall[finRoom] || "base") === p.k ? " on" : ""), onClick: () => applyFinish("wall", p.k),
        }, h("i", { style: { background: p.hex } }), p.n))
        : PATTERNS.map((p) => h("button", {
          key: p.k, className: "sw" + (finRoom !== "全部" && (curFin.floor[finRoom] || "base") === p.k ? " on" : ""), onClick: () => applyFinish("floor", p.k),
        }, h("i", { style: p.k === "base" ? { background: "repeating-linear-gradient(45deg,#ead9c0 0 6px,#e4e2de 6px 12px)" } : { backgroundImage: `url(${patThumb(p.k)})`, backgroundSize: "cover" } }), p.n))));
  const firstCeil = useRef(true);
  useEffect(() => {
    if (firstCeil.current) { firstCeil.current = false; return; }
    try { localStorage.setItem(KEY_CEIL, String(ceil)); } catch (e) { /* 僅本次有效 */ }
    if (fdb && roomCode) fdb.ref("rooms/" + ROOM_PREFIX + roomCode + "/ceil").set(ceil);
  }, [ceil]);

  // 頂天櫃（高度剛好等於舊天花板）跟著新天花板一起變
  const changeCeil = (n) => {
    const v = clampCeil(n), old = ceilRef.current;
    if (v === old) return;
    setCeil(v);
    setItems((arr) => raiseToCeil(arr, old, v));
  };

  useEffect(() => {
    if (firstSave.current) { firstSave.current = false; return; }
    const t = setTimeout(() => {
      const s = JSON.stringify(items);
      try {
        localStorage.setItem(KEY, s);
        setStatus("已自動儲存");
      } catch (e) { setStatus("儲存失敗，配置僅保留在本次畫面"); }
      if (fdb && roomCode && joined.current && s !== lastSynced.current) {
        lastSynced.current = s;
        roomItemsRef(roomCode).set(s);
      }
    }, 700);
    return () => clearTimeout(t);
  }, [items]);

  const onDrag = (v) => { dragging.current = v; };
  const enterRoom = (c) => {
    setRoomCode(c); setPendingJoin(null); setCodeInput("");
    history.replaceState(null, "", "#" + c);
    setStatus(`已加入房間 ${c}`);
  };
  const createRoom = () => enterRoom(Math.random().toString(36).slice(2, 8));
  const checkJoin = () => {
    const c = cleanCode(codeInput);
    if (!c || !fdb) return;
    setPendingJoin({ code: c, checking: true });
    let done = false;
    const finish = (hasData) => { if (!done) { done = true; setPendingJoin({ code: c, hasData }); } };
    roomItemsRef(c).once("value", (snap) => finish(snap.val() != null));
    setTimeout(() => finish(false), 3000);
  };
  const leaveRoom = () => {
    setRoomCode(""); setPendingJoin(null);
    history.replaceState(null, "", location.pathname + location.search);
    setStatus("已切換為單機模式");
  };
  const copyLink = () => {
    const url = roomLink(roomCode);
    const ok = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(ok, () => {});
  };

  const overlaps = useMemo(() => computeOverlaps(items), [items]);
  const outletCheck = useMemo(() => checkOutlets(items), [items]);
  const blockedOutlets = useMemo(() => new Set(outletCheck.blocked.map((x) => x.o.id)), [outletCheck]);
  const outletIssues = outletCheck.blocked.length + outletCheck.missing.length;
  // 以弱電圖的插座取代目前所有插座（舊存檔沒有插座時用）
  const loadDefaultOutlets = () => {
    if (!confirmOutlets) { setConfirmOutlets(true); setTimeout(() => setConfirmOutlets(false), 3000); return; }
    setConfirmOutlets(false);
    // 換掉柱子與原有插座，保留自己標記「新增」的插座
    setItems((a) => [...a.filter((i) => i.type !== "column" && !(isOutlet(i.type) && !isNewOutlet(i))), ...defaultStructure()]);
    setShowOutlets(true);
    setStatus("已載入弱電圖的柱子與插座");
  };
  const newOutlets = items.filter(isNewOutlet);
  const workText = () => ["C3 新增插座施工清單", ...newOutlets.map((o, i) =>
    `${i + 1}. ${o.name.slice(NEW_TAG.length)}｜${describePos(o)}`)].join("\n");
  const copyWork = () => {

          ? h("div", { className: "row2" },
            h(NumField, { label: "離地高度", value: selItem.h, onCommit: (n) => updateItem(sel, { h: Math.min(n, ceil) }) }),
            h("button", { className: "ic" + (isNewOutlet(selItem) ? " newon" : ""), onClick: toggleNew }, isNewOutlet(selItem) ? "新增（要拉線）" : "原有插座"),
            h("span", { className: "unit" }, `${describePos(selItem)}${blockedOutlets.has(sel) ? "・目前被傢俱擋住" : ""}`))
          : h("div", { className: "row2" },
            // 換類型：位置、尺寸、旋轉不變；名稱若是原類型的預設名就跟著換
            h("label", { className: "nf" }, h("span", null, "類型"),
              h("select", {
                className: "typesel", value: selItem.type,
                onChange: (e) => {
                  const t = e.target.value, old = LIB[selItem.type];
                  updateItem(sel, { type: t, name: !old || selItem.name === old.name ? LIB[t].name : selItem.name });
                },
              }, CATS.filter((c) => c !== "插座").map((c) => h("optgroup", { key: c, label: c },
                Object.entries(LIB).filter(([k, v]) => v.cat === c && !isOutlet(k)).map(([k, v]) => h("option", { key: k, value: k }, v.name)))))),
            h(NumField, { label: "寬", value: selItem.w, onCommit: (n) => updateItem(sel, { w: n }) }),
            h(NumField, { label: "深", value: selItem.d, onCommit: (n) => updateItem(sel, { d: n }) }),
            h(NumField, { label: "高", value: selItem.h, onCommit: (n) => updateItem(sel, { h: n }) }),
            h("span", { className: "unit" }, "cm・虛線數字為距離，低於 60 顯示紅色")))) : null);
}

window.__C3 = { defaultItems, computeOverlaps, normalizeItems, KEY };
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
